<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StrategyView - Cloud Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #131722; color: #d1d4dc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Nav */
    header { height: 44px; background: #1e222d; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; }
    .brand { font-size: 14px; font-weight: bold; color: #2962ff; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .cur-btn { background: #131722; color: #d1d4dc; border: 1px solid #2a2e39; padding: 3px 6px; border-radius: 4px; font-size: 11px; }
    .wallet-box { background: #131722; border: 1px solid #2a2e39; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
    .fund-val { color: #26a69a; font-weight: bold; }

    /* Replay Sub-bar */
    .replay-bar { height: 36px; background: #181c27; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; flex-shrink: 0; }
    .replay-status { color: #d29922; font-weight: 600; font-size: 11px; }
    .replay-actions { display: flex; gap: 6px; }
    .btn-replay { background: #d29922; color: #000; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
    .btn-step { background: #2a2e39; color: #fff; border: 1px solid #434651; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    /* Chart Window */
    #chart-box { flex: 1; width: 100%; position: relative; }

    /* Bottom Fixed Buy/Sell Pad (Clean & Thumb-Friendly) */
    .bottom-order-pad { background: #1e222d; border-top: 1px solid #2a2e39; padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-box { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #787b86; }
    .qty-input { width: 55px; background: #131722; border: 1px solid #363a45; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; text-align: center; }
    .btn-trade { flex: 1; border: none; padding: 9px; border-radius: 5px; font-weight: bold; font-size: 13px; cursor: pointer; color: #fff; }
    .btn-buy { background: #26a69a; }
    .btn-sell { background: #ef5350; }

    /* Bottom Mini Logs */
    .logs-panel { height: 75px; background: #131722; border-top: 1px solid #2a2e39; flex-shrink: 0; font-size: 10px; overflow-y: auto; padding: 4px 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid #1e222d; }
    th { color: #787b86; }

    /* Pro Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
    .modal-card { background: #1e222d; border: 1px solid #d29922; border-radius: 10px; padding: 20px; max-width: 360px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header>
    <div class="brand">⚡ StrategyView</div>
    <div class="top-actions">
      <select class="cur-btn" id="currency-select" onchange="switchCurrency()">
        <option value="INR">INR (₹)</option>
        <option value="USD">USD ($)</option>
      </select>
      <div class="wallet-box">
        <span id="bal-text" class="fund-val">₹10,000.00</span>
        <button onclick="editFund()" style="background:#2a2e39; border:none; color:#787b86; padding:2px 5px; border-radius:3px; margin-left:4px; font-size:10px; cursor:pointer;">Edit</button>
      </div>
    </div>
  </header>

  <!-- Bar Replay Toolbar -->
  <div class="replay-bar">
    <div class="replay-status">
      <span>⏪ Replay: </span><b id="replay-badge" style="color:#d29922;">3 Left</b>
    </div>
    <div class="replay-actions">
      <button class="btn-replay" onclick="triggerReplaySession()">▶ Start Replay</button>
      <button class="btn-step" onclick="stepNextBar()">⏭ Next Candle</button>
    </div>
  </div>

  <!-- Chart View -->
  <div id="chart-box">
    <div id="tv_chart" style="height:100%; width:100%;"></div>
  </div>

  <!-- Bottom Order Pad (Cleanly placed at bottom) -->
  <div class="bottom-order-pad">
    <div class="qty-box">
      <span>Qty:</span>
      <input type="number" id="trade-qty" class="qty-input" value="0.05" step="0.01">
    </div>
    <button class="btn-trade btn-buy" onclick="runTrade('BUY')">BUY / LONG</button>
    <button class="btn-trade btn-sell" onclick="runTrade('SELL')">SELL / SHORT</button>
  </div>

  <!-- Orders Log -->
  <div class="logs-panel">
    <table>
      <thead>
        <tr><th>Time</th><th>Side</th><th>Price</th><th>Status</th></tr>
      </thead>
      <tbody id="trade-list">
        <tr><td colspan="4" style="text-align:center; color:#787b86; padding:4px;">No trades taken yet.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pro Modal -->
  <div id="pro-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="color:#d29922; margin-bottom:10px; font-size:16px;">🔒 PRO UNLIMITED REPLAY</h3>
      <p style="font-size:12px; color:#8b949e; line-height:1.5; margin-bottom:15px;">તમારા આજના ૩ ફ્રી રીપ્લે પૂરા થઈ ગયા છે. અનલિમિટેડ બેકટેસ્ટિંગ માટે પ્રો પ્લાન અનલોક કરો.</p>
      <button style="background:#d29922; color:#000; border:none; padding:10px; width:100%; border-radius:6px; font-weight:bold; font-size:13px; cursor:pointer;" onclick="alert('Payment Gateway Loading...')">Upgrade @ ₹599/mo</button>
      <button style="background:none; border:none; color:#787b86; margin-top:10px; font-size:12px; cursor:pointer;" onclick="closeProModal()">Close</button>
    </div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "15",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#1e222d",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "hide_side_toolbar": false,
      "container_id": "tv_chart"
    });

    let currentCur = 'INR';
    let balance = 10000;
    const usdRate = 86.5;
    let btcPrice = 66000;

    let replaysAvailable = 3;
    let isReplayActive = false;

    function triggerReplaySession() {
      if (replaysAvailable > 0) {
        replaysAvailable--;
        isReplayActive = true;
        document.getElementById('replay-badge').innerText = `${replaysAvailable} Left`;
        alert(`⏪ Bar Replay સેશન શરૂ થયું! (${replaysAvailable} બાકી). હવે 'Next Candle' દબાવીને એક-એક કેન્ડલ આગળ વધારી શકો છો.`);
      } else {
        document.getElementById('pro-modal').style.display = 'flex';
      }
    }

    function stepNextBar() {
      if (!isReplayActive) {
        alert("પહેલા 'Start Replay' બટન દબાવો!");
      } else {
        alert("⏭ આગલી કેન્ડલ લોડ થઈ રહી છે...");
      }
    }

    function closeProModal() { document.getElementById('pro-modal').style.display = 'none'; }

    async function fetchBtc() {
      try {
        const r = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
        const d = await r.json();
        btcPrice = parseFloat(d.price);
      } catch(e) {}
    }
    fetchBtc();
    setInterval(fetchBtc, 4000);

    function editFund() {
      const sym = currentCur === 'INR' ? '₹' : '$';
      let f = prompt(`Set Virtual Fund (${sym}5,000 to ${sym}10,00,000):`, balance);
      if (f && !isNaN(f) && f >= 5000 && f <= 1000000) {
        balance = parseFloat(f);
        updateUI();
      }
    }

    function switchCurrency() {
      const newCur = document.getElementById('currency-select').value;
      if (newCur !== currentCur) {
        balance = newCur === 'USD' ? (balance / usdRate) : (balance * usdRate);
        currentCur = newCur;
        updateUI();
      }
    }

    function updateUI() {
      const sym = currentCur === 'INR' ? '₹' : '$';
      document.getElementById('bal-text').innerText = `${sym}${balance.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
    }

    let tradeCount = 0;
    function runTrade(side) {
      const qty = parseFloat(document.getElementById('trade-qty').value) || 0.05;
      const rate = currentCur === 'INR' ? (btcPrice * usdRate) : btcPrice;
      const total = qty * rate;
      const sym = currentCur === 'INR' ? '₹' : '$';

      if (side === 'BUY' && total > balance) {
        alert("Insufficient Funds!");
        return;
      }

      balance = side === 'BUY' ? balance - total : balance + total;
      updateUI();

      const tb = document.getElementById('trade-list');
      if (tradeCount === 0) tb.innerHTML = "";
      tradeCount++;

      const row = `<tr>
        <td>${new Date().toLocaleTimeString()}</td>
        <td style="color:${side === 'BUY' ? '#26a69a' : '#ef5350'}; font-weight:bold;">${side}</td>
        <td>${sym}${rate.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
        <td style="color:#26a69a;">FILLED</td>
      </tr>`;
      tb.innerHTML = row + tb.innerHTML;
    }
  </script>
</body>
</html>
