<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StrategyView - Cloud Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #131722; color: #d1d4dc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Bar */
    header { height: 46px; background: #1e222d; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; }
    .brand { font-size: 14px; font-weight: bold; color: #2962ff; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .cur-btn { background: #131722; color: #d1d4dc; border: 1px solid #2a2e39; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
    .wallet-box { background: #131722; border: 1px solid #2a2e39; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .fund-val { color: #26a69a; font-weight: bold; }

    /* Chart Container */
    #chart-box { flex: 1; width: 100%; position: relative; }

    /* Floating Buy/Sell over Chart */
    .order-overlay { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(30, 34, 45, 0.9); border: 1px solid #2a2e39; border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
    .qty-input { width: 55px; background: #131722; border: 1px solid #363a45; color: #fff; padding: 4px; border-radius: 4px; font-size: 11px; text-align: center; }
    .btn-buy { background: #26a69a; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
    .btn-sell { background: #ef5350; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }

    /* Bottom Logs */
    .logs-panel { height: 95px; background: #1e222d; border-top: 1px solid #2a2e39; flex-shrink: 0; font-size: 11px; overflow-y: auto; padding: 6px 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px; text-align: left; border-bottom: 1px solid #21262d; }
    th { color: #787b86; }
  </style>
</head>
<body>

  <header>
    <span class="brand">⚡ StrategyView</span>
    <div class="top-actions">
      <select class="cur-btn" id="currency-select" onchange="switchCurrency()">
        <option value="INR">INR (₹)</option>
        <option value="USD">USD ($)</option>
      </select>
      <div class="wallet-box">
        <span id="bal-text" class="fund-val">₹10,000.00</span>
        <button onclick="editFund()" style="background:#2a2e39; border:none; color:#787b86; padding:2px 5px; border-radius:3px; margin-left:4px; font-size:10px; cursor:pointer;">Edit</button>
      </div>
    </div>
  </header>

  <div id="chart-box">
    <div class="order-overlay">
      <input type="number" id="trade-qty" class="qty-input" value="0.05" step="0.01">
      <button class="btn-buy" onclick="runTrade('BUY')">BUY</button>
      <button class="btn-sell" onclick="runTrade('SELL')">SELL</button>
    </div>
    <div id="tv_chart" style="height:100%; width:100%;"></div>
  </div>

  <div class="logs-panel">
    <table>
      <thead>
        <tr><th>Time</th><th>Side</th><th>Price</th><th>Status</th></tr>
      </thead>
      <tbody id="trade-list">
        <tr><td colspan="4" style="text-align:center; color:#787b86;">No open trades. Tap BUY/SELL on chart.</td></tr>
      </tbody>
    </table>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "15",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#1e222d",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "hide_side_toolbar": false,
      "container_id": "tv_chart"
    });

    let currentCur = 'INR';
    let balance = 10000;
    const usdRate = 86.5;
    let btcPrice = 66000;

    async function fetchBtc() {
      try {
        const r = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
        const d = await r.json();
        btcPrice = parseFloat(d.price);
      } catch(e) {}
    }
    fetchBtc();
    setInterval(fetchBtc, 4000);

    function editFund() {
      const sym = currentCur === 'INR' ? '₹' : '$';
      let f = prompt(`Set Virtual Fund (${sym}5,000 to ${sym}10,00,000):`, balance);
      if (f && !isNaN(f) && f >= 5000 && f <= 1000000) {
        balance = parseFloat(f);
        updateUI();
      }
    }

    function switchCurrency() {
      const newCur = document.getElementById('currency-select').value;
      if (newCur !== currentCur) {
        balance = newCur === 'USD' ? (balance / usdRate) : (balance * usdRate);
        currentCur = newCur;
        updateUI();
      }
    }

    function updateUI() {
      const sym = currentCur === 'INR' ? '₹' : '$';
      document.getElementById('bal-text').innerText = `${sym}${balance.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
    }

    let tradeCount = 0;
    function runTrade(side) {
      const qty = parseFloat(document.getElementById('trade-qty').value) || 0.05;
      const rate = currentCur === 'INR' ? (btcPrice * usdRate) : btcPrice;
      const total = qty * rate;
      const sym = currentCur === 'INR' ? '₹' : '$';

      if (side === 'BUY' && total > balance) {
        alert("Insufficient Funds!");
        return;
      }

      balance = side === 'BUY' ? balance - total : balance + total;
      updateUI();

      const tb = document.getElementById('trade-list');
      if (tradeCount === 0) tb.innerHTML = "";
      tradeCount++;

      const row = `<tr>
        <td>${new Date().toLocaleTimeString()}</td>
        <td style="color:${side === 'BUY' ? '#26a69a' : '#ef5350'}; font-weight:bold;">${side}</td>
        <td>${sym}${rate.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
        <td style="color:#26a69a;">FILLED</td>
      </tr>`;
      tb.innerHTML = row + tb.innerHTML;
    }
  </script>
</body>
</html>
