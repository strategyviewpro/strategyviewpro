<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StrategyView - Trading Terminal</title>
  <!-- Ultra-Fast High Reliability CDN for Lightweight Charts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.1/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; background: #131722; color: #d1d4dc; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Bar */
    header { height: 44px; background: #1e222d; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; }
    .brand { font-size: 15px; font-weight: 800; color: #2962ff; }
    .top-right { display: flex; align-items: center; gap: 6px; }
    .cur-sel { background: #131722; color: #d1d4dc; border: 1px solid #2a2e39; padding: 3px 6px; border-radius: 4px; font-size: 11px; }
    .fund-tag { background: #131722; border: 1px solid #2a2e39; padding: 3px 6px; border-radius: 4px; font-size: 11px; }
    .fund-val { color: #26a69a; font-weight: bold; }

    /* Bar Replay Toolbar (Visible on Laptop & Mobile) */
    .replay-bar { background: #181c27; border-bottom: 1px solid #2a2e39; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 6px; flex-wrap: wrap; }
    .controls-left { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .cut-date-input { background: #131722; border: 1px solid #363a45; color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
    .btn-action { border: none; padding: 5px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
    .btn-cut { background: #d29922; color: #000; }
    .btn-next { background: #2962ff; color: #fff; }
    .btn-live { background: #2a2e39; color: #8b949e; }
    .quota-badge { font-size: 10px; color: #d29922; border: 1px solid #d29922; padding: 2px 5px; border-radius: 3px; font-weight: bold; }

    /* Chart Container (Fixed Viewport) */
    #chart-area { flex: 1 1 auto; width: 100%; min-height: 250px; position: relative; background: #131722; }

    /* Bottom Order Execution Pad */
    .order-pad { background: #1e222d; border-top: 1px solid #2a2e39; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 6px; }
    .price-box { display: flex; flex-direction: column; min-width: 90px; }
    .price-label { font-size: 9px; color: #787b86; }
    .price-val { font-size: 13px; font-weight: bold; color: #2962ff; }
    .qty-box { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #787b86; }
    .qty-in { width: 50px; background: #131722; border: 1px solid #363a45; color: #fff; padding: 4px; border-radius: 4px; font-size: 11px; text-align: center; }
    .btn-trade { border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; color: #fff; flex: 1; max-width: 110px; }
    .btn-buy { background: #26a69a; }
    .btn-sell { background: #ef5350; }

    /* Positions Log Tray */
    .trades-tray { height: 75px; background: #131722; border-top: 1px solid #2a2e39; flex-shrink: 0; font-size: 10px; overflow-y: auto; padding: 4px 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid #1e222d; }
    th { color: #787b86; }

    /* Pro Paywall Modal */
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: #1e222d; border: 1px solid #d29922; border-radius: 8px; padding: 18px; max-width: 360px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">⚡ StrategyView</div>
    <div class="top-right">
      <select class="cur-sel" id="currency-select" onchange="switchCurrency()">
        <option value="INR">INR (₹)</option>
        <option value="USD">USD ($)</option>
      </select>
      <div class="fund-tag">
        <span id="bal-text" class="fund-val">₹10,000.00</span>
        <button onclick="editFund()" style="background:#2a2e39; border:none; color:#787b86; padding:1px 4px; border-radius:3px; margin-left:3px; font-size:10px; cursor:pointer;">Edit</button>
      </div>
    </div>
  </header>

  <!-- Bar Replay Toolbar -->
  <div class="replay-bar">
    <div class="controls-left">
      <span style="font-size:11px; color:#8b949e;">Cut Date:</span>
      <input type="date" id="replay-date" class="cut-date-input" value="2024-03-01" min="2024-01-01" max="2026-09-01">
      <button class="btn-action btn-cut" onclick="startBarReplay()">✂ Cut & Replay</button>
      <button class="btn-action btn-next" id="btn-step" onclick="nextCandle()" disabled>⏭ Next Bar</button>
      <button class="btn-action btn-live" onclick="resetToLive()">Live</button>
    </div>
    <span class="quota-badge" id="quota-badge">3 Replays Left</span>
  </div>

  <!-- Dedicated Chart Viewport -->
  <div id="chart-area"></div>

  <!-- Order Execution Pad -->
  <div class="order-pad">
    <div class="price-box">
      <span class="price-label" id="price-label">Live Price</span>
      <span class="price-val" id="bar-price">$45,000.00</span>
    </div>
    <div class="qty-box">
      <span>Qty:</span>
      <input type="number" id="trade-qty" class="qty-in" value="0.05" step="0.01">
    </div>
    <button class="btn-trade btn-buy" onclick="runTrade('BUY')">BUY / LONG</button>
    <button class="btn-trade btn-sell" onclick="runTrade('SELL')">SELL / SHORT</button>
  </div>

  <!-- Trades Table -->
  <div class="trades-tray">
    <table>
      <thead>
        <tr><th>Bar Date</th><th>Side</th><th>Qty</th><th>Exec Price</th><th>Status</th></tr>
      </thead>
      <tbody id="trades-list">
        <tr><td colspan="5" style="text-align:center; color:#787b86;">No trades placed yet.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div id="pro-modal" class="modal-backdrop">
    <div class="modal-box">
      <h3 style="color:#d29922; margin-bottom:8px; font-size:15px;">🔒 PRO UNLIMITED BAR REPLAY</h3>
      <p style="font-size:11px; color:#8b949e; line-height:1.5; margin-bottom:14px;">Daily 3 free replay sessions completed. Upgrade to unlock unlimited step-by-step backtesting and custom historical timeframes.</p>
      <button style="background:#d29922; color:#000; border:none; padding:8px; width:100%; border-radius:4px; font-weight:bold; font-size:12px; cursor:pointer;" onclick="alert('Payment Gateway...')">Upgrade to Pro @ ₹599/mo</button>
      <button style="background:none; border:none; color:#787b86; margin-top:8px; font-size:11px; cursor:pointer;" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // 1. Generate Historical Candlestick Data (2024 to 2026)
    const masterData = [];
    let startEpoch = new Date(2024, 0, 1).getTime();
    let currentP = 42500;

    for (let i = 0; i < 980; i++) {
      let d = new Date(startEpoch + (i * 86400000));
      let y = d.getFullYear();
      let m = String(d.getMonth() + 1).padStart(2, '0');
      let day = String(d.getDate()).padStart(2, '0');
      let dtString = `${y}-${m}-${day}`;

      let change = (Math.sin(i / 14) * 0.018) + ((Math.random() - 0.485) * 0.032);
      let o = currentP;
      let c = o * (1 + change);
      let h = Math.max(o, c) * (1 + Math.random() * 0.01);
      let l = Math.min(o, c) * (1 - Math.random() * 0.01);
      currentP = c;

      masterData.push({
        time: dtString,
        open: parseFloat(o.toFixed(2)),
        high: parseFloat(h.toFixed(2)),
        low: parseFloat(l.toFixed(2)),
        close: parseFloat(c.toFixed(2))
      });
    }

    // 2. Initialize Lightweight Chart Engine with Safe Dimensions
    let chart, candleSeries;
    const container = document.getElementById('chart-area');

    function initTradingChart() {
      const containerWidth = container.clientWidth || window.innerWidth;
      const containerHeight = container.clientHeight || (window.innerHeight - 170);

      chart = LightweightCharts.createChart(container, {
        width: containerWidth,
        height: containerHeight,
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        timeScale: { borderColor: '#2a2e39', timeVisible: false },
        rightPriceScale: { borderColor: '#2a2e39' }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350'
      });

      candleSeries.setData(masterData);
      chart.timeScale().fitContent();
    }

    // Run init after DOM is fully ready
    window.addEventListener('load', initTradingChart);

    // 3. Replay Logic
    let currentCurrency = 'INR';
    let balance = 10000;
    const usdToInr = 86.5;
    let replaysCount = 3;
    let isReplayRunning = false;
    let activeIndex = masterData.length - 1;
    let currentActivePrice = masterData[activeIndex].close;
    let currentActiveDate = masterData[activeIndex].time;
    let orders = [];

    function startBarReplay() {
      if (replaysCount <= 0) {
        document.getElementById('pro-modal').style.display = 'flex';
        return;
      }

      const selectedDate = document.getElementById('replay-date').value;
      const foundIdx = masterData.findIndex(candle => candle.time >= selectedDate);

      if (foundIdx === -1 || foundIdx < 5) {
        alert("Please select a date between 2024-02-01 and 2026-08-01");
        return;
      }

      replaysCount--;
      document.getElementById('quota-badge').innerText = `${replaysCount} Replays Left`;
      isReplayRunning = true;
      activeIndex = foundIdx;

      // Slice Candles up to chosen cut date
      const cutDataset = masterData.slice(0, activeIndex + 1);
      candleSeries.setData(cutDataset);
      chart.timeScale().fitContent();

      const activeBar = masterData[activeIndex];
      currentActivePrice = activeBar.close;
      currentActiveDate = activeBar.time;

      document.getElementById('price-label').innerText = `Replay (${currentActiveDate})`;
      document.getElementById('btn-step').disabled = false;
      document.getElementById('btn-step').style.opacity = '1';
      renderPrice();
    }

    function nextCandle() {
      if (!isReplayRunning) return;
      if (activeIndex >= masterData.length - 1) {
        alert("You have reached the latest live bar!");
        return;
      }

      activeIndex++;
      const nextBar = masterData[activeIndex];
      candleSeries.update(nextBar);

      currentActivePrice = nextBar.close;
      currentActiveDate = nextBar.time;
      document.getElementById('price-label').innerText = `Replay (${currentActiveDate})`;
      renderPrice();
    }

    function resetToLive() {
      isReplayRunning = false;
      candleSeries.setData(masterData);
      chart.timeScale().fitContent();
      const lastBar = masterData[masterData.length - 1];
      currentActivePrice = lastBar.close;
      currentActiveDate = lastBar.time;
      document.getElementById('price-label').innerText = "Live Price";
      document.getElementById('btn-step').disabled = true;
      document.getElementById('btn-step').style.opacity = '0.5';
      renderPrice();
    }

    // 4. Currency and Orders
    function switchCurrency() {
      const cur = document.getElementById('currency-select').value;
      if (cur !== currentCurrency) {
        balance = cur === 'USD' ? (balance / usdToInr) : (balance * usdToInr);
        currentCurrency = cur;
        renderWallet();
        renderPrice();
      }
    }

    function editFund() {
      const sym = currentCurrency === 'INR' ? '₹' : '$';
      let val = prompt(`Set virtual capital (${sym}5,000 to ${sym}10,00,000):`, balance);
      if (val && !isNaN(val) && val >= 5000 && val <= 1000000) {
        balance = parseFloat(val);
        renderWallet();
      }
    }

    function renderWallet() {
      const sym = currentCurrency === 'INR' ? '₹' : '$';
      document.getElementById('bal-text').innerText = `${sym}${balance.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
    }

    function renderPrice() {
      const sym = currentCurrency === 'INR' ? '₹' : '$';
      const effectiveRate = currentCurrency === 'INR' ? (currentActivePrice * usdToInr) : currentActivePrice;
      document.getElementById('bar-price').innerText = `${sym}${effectiveRate.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
    }

    function runTrade(type) {
      const qty = parseFloat(document.getElementById('trade-qty').value) || 0.05;
      const effectiveRate = currentCurrency === 'INR' ? (currentActivePrice * usdToInr) : currentActivePrice;
      const totalAmount = qty * effectiveRate;
      const sym = currentCurrency === 'INR' ? '₹' : '$';

      if (type === 'BUY' && totalAmount > balance) {
        alert("Insufficient capital!");
        return;
      }

      balance = type === 'BUY' ? balance - totalAmount : balance + totalAmount;
      renderWallet();

      const tbody = document.getElementById('trades-list');
      if (orders.length === 0) tbody.innerHTML = "";
      orders.unshift({ date: currentActiveDate, type, qty, price: effectiveRate });

      const row = `<tr>
        <td>${currentActiveDate}</td>
        <td style="color:${type === 'BUY' ? '#26a69a' : '#ef5350'}; font-weight:bold;">${type}</td>
        <td>${qty}</td>
        <td>${sym}${effectiveRate.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
        <td style="color:#26a69a;">FILLED</td>
      </tr>`;
      tbody.innerHTML = row + tbody.innerHTML;
    }

    function closeModal() { document.getElementById('pro-modal').style.display = 'none'; }

    // Resize Handler
    window.addEventListener('resize', () => {
      if (chart && container) {
        chart.applyOptions({
          width: container.clientWidth,
          height: container.clientHeight
        });
      }
    });

    renderWallet();
    renderPrice();
  </script>
</body>
</html>
